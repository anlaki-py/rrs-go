name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.0.1'
        required: true
        default: 'v0.0.1'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate release input
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::releases must run from master, not ${GITHUB_REF}"
            exit 1
          fi
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::version must be a stable semantic version such as v0.0.1"
            exit 1
          fi
      - name: Check the tag is unused
        run: |
          if git ls-remote origin "refs/tags/${VERSION}" | grep -q .; then
            echo "::error::tag ${VERSION} already exists"
            exit 1
          fi

  quality:
    name: Linux checks
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -timeout 2m ./...
      - run: go test -race -timeout 3m ./...

  windows-tests:
    name: Windows tests
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.x"
          cache: true
      - run: go vet ./...
      - run: go test -timeout 2m ./...

  publish:
    name: Build and publish
    needs: [quality, windows-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build release binaries
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
              -ldflags="-X github.com/anlaki-py/rrs-go/internal/buildinfo.Version=${VERSION}" \
              -o "dist/rrs-${os}-${arch}${ext}" ./cmd/rrs
          done
      - name: Smoke-test the built version
        run: |
          built=$(./dist/rrs-linux-amd64 --version)
          if [ "$built" != "$VERSION" ]; then
            echo "::error::binary reports '$built' but expected '$VERSION'"
            exit 1
          fi
      - name: Write checksums
        run: |
          (
            cd dist
            sha256sum rrs-linux-amd64 rrs-linux-arm64 rrs-windows-amd64.exe > checksums.txt
            cat checksums.txt
          )
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "rrs $VERSION" \
            --generate-notes \
            dist/rrs-linux-amd64 \
            dist/rrs-linux-arm64 \
            dist/rrs-windows-amd64.exe \
            dist/checksums.txt
